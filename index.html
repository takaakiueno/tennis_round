<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>テニス ダブルス組み合わせ表</title>
<style>
  :root {
    --bg: #f4f6f1;
    --card: #ffffff;
    --ink: #1d2a22;
    --sub: #5d6b62;
    --line: #dfe5dc;
    --accent: #2f7a4f;
    --accent-ink: #ffffff;
    --soft: #e9f2ec;
    --warn: #b3402e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Hiragino Sans", "Yu Gothic UI", "Meiryo", system-ui, sans-serif;
    line-height: 1.6;
  }
  main { max-width: 960px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { font-size: 22px; margin: 0 0 16px; }
  h2 { font-size: 17px; margin: 32px 0 12px; }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 16px;
  }
  form { display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-end; }
  label { display: flex; flex-direction: column; font-size: 13px; color: var(--sub); gap: 4px; }
  input, select {
    font: inherit;
    font-size: 16px;
    color: var(--ink);
    padding: 8px 10px;
    width: 110px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: #fff;
  }
  button {
    font: inherit;
    font-size: 16px;
    padding: 9px 22px;
    border-radius: 6px;
    border: 1px solid var(--accent);
    background: var(--accent);
    color: var(--accent-ink);
    cursor: pointer;
  }
  button.sub { background: #fff; color: var(--accent); }
  button:disabled { opacity: .5; cursor: default; }
  #msg { margin-top: 12px; font-size: 14px; min-height: 1.6em; }
  #msg.error { color: var(--warn); }

  table.sched { font-size: 15px; }
  table.sched th, table.sched td { padding: 4px 12px; }
  table.sched td.game { font-weight: 600; }
  table.sched .vs { color: var(--sub); font-weight: 400; margin: 0 8px; }
  table.sched td.restcell { color: var(--sub); text-align: left; }
  table.sched tr:nth-child(odd) td { background: #fafbf9; }
  table.sched td.chk { padding: 4px 8px; }
  table.sched td.chk input { width: 18px; height: 18px; padding: 0; margin: 0; vertical-align: middle; cursor: pointer; accent-color: var(--accent); }
  table.sched tr.done td.game, table.sched tr.done td.restcell { color: #a9b3ac; font-weight: 400; }

  .scroll { overflow-x: auto; }
  table { border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
  th, td { border: 1px solid var(--line); padding: 3px 7px; text-align: center; white-space: nowrap; }
  th { background: var(--soft); font-weight: 600; }
  td.self { background: #f0f0f0; }
  .dist { font-size: 14px; margin: 4px 0; }
  .note { font-size: 13px; color: var(--sub); }
  .notice { margin-top: 16px; background: #fff8e6; border-color: #f0dca8; font-size: 14px; }
  .inner h3 { font-size: 14px; margin: 0 0 6px; }

  @media print {
    body { background: #fff; }
    .noprint { display: none !important; }
    .card { break-inside: avoid; }
  }
</style>
</head>
<body>
<main>
  <h1>テニス ダブルス組み合わせ表</h1>

  <div class="card noprint">
    <form id="form">
      <label>面数
        <select id="courts">
          <option value="1">1</option>
          <option value="2" selected>2</option>
          <option value="3">3</option>
        </select>
      </label>
      <label>人数
        <input id="players" type="number" min="4" max="60" value="10">
      </label>
      <label>ラウンド数
        <input id="rounds" type="number" min="1" max="100" value="8">
      </label>
      <button id="go" type="submit">決定</button>
      <button id="print" type="button" class="sub" hidden>印刷</button>
    </form>
    <div id="msg"></div>
  </div>

  <div id="notice" class="card notice" hidden>※人数が面数×4の倍数のため、同じ顔ぶればかりにならないよう、一部の人の休みを不公平が出ないロジックで1ラウンド長くしています。</div>

  <div id="result"></div>
</main>

<script>
"use strict";

/* ===== 組み合わせ生成ロジック ===== */

var WP = 3;  // ペア(味方)の重複の重み
var WO = 1;  // 対戦相手の重複の重み

function now() {
  return (typeof performance !== "undefined") ? performance.now() : Date.now();
}

function shuffle(a) {
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

function matrix(n) {
  var m = [];
  for (var i = 0; i < n; i++) m.push(new Array(n).fill(0));
  return m;
}

// 状態: ペア回数 P, 対戦回数 O, 評価値 total (= WP*ΣP² + WO*ΣO²、小さいほど均等)
function newState(n) {
  return { P: matrix(n), O: matrix(n), total: 0 };
}

function bump(st, M, a, b, sign, w) {
  var c = M[a][b];
  st.total += (sign > 0) ? w * (2 * c + 1) : -w * (2 * c - 1);
  M[a][b] = M[b][a] = c + sign;
}

// court = [a, b, c, d] は「a・b 対 c・d」
function applyCourt(st, m, sign) {
  bump(st, st.P, m[0], m[1], sign, WP);
  bump(st, st.P, m[2], m[3], sign, WP);
  bump(st, st.O, m[0], m[2], sign, WO);
  bump(st, st.O, m[0], m[3], sign, WO);
  bump(st, st.O, m[1], m[2], sign, WO);
  bump(st, st.O, m[1], m[3], sign, WO);
}

function applyRound(st, round, sign) {
  for (var i = 0; i < round.courts.length; i++) applyCourt(st, round.courts[i], sign);
}

// 出場者 sel (4×面数 人) を、現在の履歴に対して最もコストが低くなるよう
// コートとペアに分ける。全通りを調べる(同点はランダム)。
function bestRound(sel, st) {
  var n = sel.length, full = (1 << n) - 1;
  var P = st.P, O = st.O;
  var cache = new Map();

  function quad(i, j, k, l) {
    var key = (1 << i) | (1 << j) | (1 << k) | (1 << l);
    var v = cache.get(key);
    if (v) return v;
    var a = sel[i], b = sel[j], c = sel[k], d = sel[l];
    var opts = [[a, b, c, d], [a, c, b, d], [a, d, b, c]];
    var best = Infinity, pick = null, ties = 0;
    for (var x = 0; x < 3; x++) {
      var o = opts[x];
      var cost = WP * (P[o[0]][o[1]] + P[o[2]][o[3]]) +
                 WO * (O[o[0]][o[2]] + O[o[0]][o[3]] + O[o[1]][o[2]] + O[o[1]][o[3]]);
      if (cost < best) { best = cost; pick = o; ties = 1; }
      else if (cost === best) { ties++; if (Math.random() * ties < 1) pick = o; }
    }
    v = { cost: best, m: pick };
    cache.set(key, v);
    return v;
  }

  var bestCost = Infinity, bestCourts = null, ties = 0, cur = [];
  (function rec(mask, cost) {
    if (cost > bestCost) return;
    if (mask === full) {
      if (cost < bestCost) { bestCost = cost; bestCourts = cur.slice(); ties = 1; }
      else { ties++; if (Math.random() * ties < 1) bestCourts = cur.slice(); }
      return;
    }
    var i = 0;
    while ((mask >> i) & 1) i++;
    for (var j = i + 1; j < n; j++) {
      if ((mask >> j) & 1) continue;
      for (var k = j + 1; k < n; k++) {
        if ((mask >> k) & 1) continue;
        for (var l = k + 1; l < n; l++) {
          if ((mask >> l) & 1) continue;
          var q = quad(i, j, k, l);
          cur.push(q.m);
          rec(mask | (1 << i) | (1 << j) | (1 << k) | (1 << l), cost + q.cost);
          cur.pop();
        }
      }
    }
  })(0, 0);

  return bestCourts.map(function (m) { return m.slice(); });
}

// 参加人数が「1ラウンドの出場人数(面数×4)」のちょうど k 倍(k は2以上)のとき、
// 全員の休みの間隔をそろえると k ラウンドごとに同じ顔ぶれが出るだけになる(顔ぶれの固定)。
// これを防ぐため、毎ラウンド1人だけ、試合数が同じ「出る予定の人」と「休む予定の人」を入れ替える。
// 入れ替えで休みが延びるのは1ラウンドまで(連続休みは最長でも k ラウンド)。
// 延びる役は、まだ延びたことのない人から順に回す。
function mixFactor(nPlayers, C) {
  var per = 4 * C;
  return (nPlayers % per === 0 && nPlayers / per >= 2) ? nPlayers / per : 0;
}

function mixSwap(sel, rest, games, last, ext, r, k) {
  var bestO = -1, bestI = -1, bestKey = null, ties = 0;
  for (var a = 0; a < sel.length; a++) {
    var o = sel[a];
    if (last[o] < 0 || r - last[o] > k) continue; // 休みが k ラウンドを超えてしまう人は延ばさない
    for (var b = 0; b < rest.length; b++) {
      var i = rest[b];
      if (games[i] !== games[o]) continue;        // 試合数が同じ人どうしだけ(試合数の差は変わらない)
      // 優先: 延びたことの少ない人 → 代わりに出る人は前のラウンドに出ていない人 → 休みが長い人
      var key = [ext[o], last[i] === r - 1 ? 1 : 0, last[i]];
      var cmp = 0;
      if (bestKey) for (var x = 0; x < 3 && !cmp; x++) cmp = key[x] - bestKey[x];
      if (!bestKey || cmp < 0) { bestKey = key; bestO = a; bestI = b; ties = 1; }
      else if (cmp === 0) { ties++; if (Math.random() * ties < 1) { bestO = a; bestI = b; } }
    }
  }
  if (bestO < 0) return;
  var t = sel[bestO]; sel[bestO] = rest[bestI]; rest[bestI] = t;
  ext[t]++;
  rest.sort(function (p, q) { return p - q; });
}

// 貪欲法で全ラウンドを1回組む
function buildOnce(C, N, R) {
  var st = newState(N);
  var games = new Array(N).fill(0);
  var last = new Array(N).fill(-1);
  var ext = new Array(N).fill(0);
  var k = mixFactor(N, C);
  var schedule = [];
  for (var r = 0; r < R; r++) {
    var order = [];
    for (var i = 0; i < N; i++) order.push(i);
    shuffle(order);
    // 出場数が少ない人 → 休みが長い人 の順に優先(同順位はシャッフル順)
    order.sort(function (a, b) { return (games[a] - games[b]) || (last[a] - last[b]); });
    var sel = shuffle(order.slice(0, 4 * C));
    var rest = order.slice(4 * C).sort(function (a, b) { return a - b; });
    if (k) mixSwap(sel, rest, games, last, ext, r, k);
    for (var s = 0; s < sel.length; s++) { games[sel[s]]++; last[sel[s]] = r; }
    var round = { courts: bestRound(sel, st), rest: rest };
    if (k) round.mx = true; // 顔ぶれ固定の対策を使ったラウンド
    applyRound(st, round, 1);
    schedule.push(round);
  }
  return { schedule: schedule, total: st.total };
}

// 同じラウンド内の出場者2人を入れ替えて、評価値が悪化しなければ採用する
function improve(schedule, N, C, budgetMs) {
  var st = newState(N);
  for (var r = 0; r < schedule.length; r++) applyRound(st, schedule[r], 1);
  if (C === 1) return st.total; // 1面は各ラウンド3通りの比較で十分なので下の別処理
  var end = now() + budgetMs, iter = 0;
  while (true) {
    if ((++iter & 255) === 0 && now() > end) break;
    var round = schedule[Math.floor(Math.random() * schedule.length)];
    var c1 = Math.floor(Math.random() * C), s1 = Math.floor(Math.random() * 4);
    var c2 = Math.floor(Math.random() * C), s2 = Math.floor(Math.random() * 4);
    if (c1 === c2 && (s1 >> 1) === (s2 >> 1)) continue; // 同じペア内は入れ替えても同じ
    var before = st.total;
    applyRound(st, round, -1);
    var t = round.courts[c1][s1]; round.courts[c1][s1] = round.courts[c2][s2]; round.courts[c2][s2] = t;
    applyRound(st, round, 1);
    if (st.total > before) {
      applyRound(st, round, -1);
      t = round.courts[c1][s1]; round.courts[c1][s1] = round.courts[c2][s2]; round.courts[c2][s2] = t;
      applyRound(st, round, 1);
    }
  }
  return st.total;
}

// 1面のとき用: 各ラウンドのペアの組み替え(3通り)を順に見直す
function improveSingle(schedule, N, budgetMs) {
  var st = newState(N);
  for (var r = 0; r < schedule.length; r++) applyRound(st, schedule[r], 1);
  var end = now() + budgetMs, changed = true;
  while (changed && now() < end) {
    changed = false;
    for (r = 0; r < schedule.length; r++) {
      var m = schedule[r].courts[0];
      for (var s = 2; s <= 3; s++) {
        var before = st.total;
        applyCourt(st, m, -1);
        var t = m[1]; m[1] = m[s]; m[s] = t;
        applyCourt(st, m, 1);
        if (st.total < before) { changed = true; }
        else {
          applyCourt(st, m, -1);
          t = m[1]; m[1] = m[s]; m[s] = t;
          applyCourt(st, m, 1);
        }
      }
    }
  }
  return st.total;
}

// 全体: 時間の許す限り貪欲法をやり直して最良を選び、最後に入れ替えで改善
function generate(C, N, R, budgetMs) {
  budgetMs = budgetMs || 1200;
  var end = now() + budgetMs * 0.5;
  var best = null, tries = 0;
  do {
    var cand = buildOnce(C, N, R);
    tries++;
    if (!best || cand.total < best.total) best = cand;
  } while (now() < end);
  if (C === 1) improveSingle(best.schedule, N, budgetMs * 0.5);
  else improve(best.schedule, N, C, budgetMs * 0.5);
  // 表示用に整える: ペア内は番号順、番号の小さいペアを左に
  best.schedule.forEach(function (round) {
    round.courts.forEach(function (m) {
      var p1 = [m[0], m[1]].sort(function (a, b) { return a - b; });
      var p2 = [m[2], m[3]].sort(function (a, b) { return a - b; });
      if (p1[0] > p2[0]) { var t = p1; p1 = p2; p2 = t; }
      m[0] = p1[0]; m[1] = p1[1]; m[2] = p2[0]; m[3] = p2[1];
    });
  });
  return { schedule: best.schedule, tries: tries, mixed: mixFactor(N, C) > 0 };
}

function stats(schedule, N) {
  var st = newState(N);
  var games = new Array(N).fill(0), rests = new Array(N).fill(0);
  schedule.forEach(function (round) {
    applyRound(st, round, 1);
    round.courts.forEach(function (m) { m.forEach(function (p) { games[p]++; }); });
    round.rest.forEach(function (p) { rests[p]++; });
  });
  var pd = {}, od = {};
  for (var i = 0; i < N; i++) for (var j = i + 1; j < N; j++) {
    pd[st.P[i][j]] = (pd[st.P[i][j]] || 0) + 1;
    od[st.O[i][j]] = (od[st.O[i][j]] || 0) + 1;
  }
  return { P: st.P, O: st.O, games: games, rests: rests, pairDist: pd, oppDist: od };
}

/* ===== 画面 ===== */

if (typeof document !== "undefined") {
  var $ = function (id) { return document.getElementById(id); };

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  }

  function distText(d) {
    return Object.keys(d).map(Number).sort(function (a, b) { return a - b; })
      .map(function (k) { return k + "回: " + d[k] + "組"; }).join(" / ");
  }

  var STORE_KEY = "tennis-doubles-schedule-v1";
  var current = null; // { C, N, R, schedule, checks }

  function save() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(current)); return true; }
    catch (e) { return false; }
  }

  function load() {
    try {
      var d = JSON.parse(localStorage.getItem(STORE_KEY));
      if (!d || !Array.isArray(d.schedule) || d.schedule.length !== d.R) return null;
      if (!Array.isArray(d.checks)) d.checks = [];
      var ok = d.schedule.every(function (round) {
        return round && Array.isArray(round.rest) && Array.isArray(round.courts) &&
          round.courts.length === d.C &&
          round.courts.every(function (m) { return Array.isArray(m) && m.length === 4; });
      });
      return ok ? d : null;
    } catch (e) { return null; }
  }

  // 顔ぶれ固定の対策を使ったラウンドがあれば、入力欄と組み合わせ表の間にお知らせを出す
  function updateNotice() {
    var on = !!(current && current.schedule.some(function (round) { return round.mx; }));
    $("notice").hidden = !on;
  }

  function render(C, N, R, out) {
    updateNotice();
    var root = $("result");
    root.textContent = "";

    root.appendChild(el("h2", "", "組み合わせ(" + C + "面・" + N + "人・" + R + "ラウンド)"));
    var hasRest = N > 4 * C;
    var sched = el("table", "sched");
    var hr = el("tr");
    hr.appendChild(el("th", "", ""));
    hr.appendChild(el("th", "", "R"));
    for (var c = 0; c < C; c++) hr.appendChild(el("th", "", "コート" + (c + 1)));
    if (hasRest) hr.appendChild(el("th", "", "休み"));
    sched.appendChild(hr);
    out.schedule.forEach(function (round, r) {
      var tr = el("tr");
      var chkCell = el("td", "chk");
      var chk = el("input");
      chk.type = "checkbox";
      chk.setAttribute("aria-label", "第" + (r + 1) + "ラウンド");
      chk.checked = !!current.checks[r];
      tr.classList.toggle("done", chk.checked);
      chk.addEventListener("change", function () {
        tr.classList.toggle("done", chk.checked);
        current.checks[r] = chk.checked;
        save();
      });
      chkCell.appendChild(chk);
      tr.appendChild(chkCell);
      tr.appendChild(el("th", "", r + 1));
      round.courts.forEach(function (m) {
        var td = el("td", "game");
        td.appendChild(document.createTextNode((m[0] + 1) + "・" + (m[1] + 1)));
        td.appendChild(el("span", "vs", "-"));
        td.appendChild(document.createTextNode((m[2] + 1) + "・" + (m[3] + 1)));
        tr.appendChild(td);
      });
      if (hasRest) {
        tr.appendChild(el("td", "restcell",
          round.rest.map(function (p) { return p + 1; }).join(", ")));
      }
      sched.appendChild(tr);
    });
    var schedWrap = el("div", "card scroll");
    schedWrap.appendChild(sched);
    root.appendChild(schedWrap);

    var s = stats(out.schedule, N);
    root.appendChild(el("h2", "", "偏りのチェック"));
    var box = el("div", "card");
    box.appendChild(el("div", "dist", "同じ人とペアを組んだ回数 … " + distText(s.pairDist)));
    box.appendChild(el("div", "dist", "同じ人と対戦した回数 … " + distText(s.oppDist)));

    var wrap = el("div", "scroll");
    var tbl = el("table");
    var rows = [["番号"], ["試合数"], ["休み"]];
    for (var i = 0; i < N; i++) { rows[0].push(i + 1); rows[1].push(s.games[i]); rows[2].push(s.rests[i]); }
    rows.forEach(function (cells, ri) {
      var tr = el("tr");
      cells.forEach(function (v, ci) { tr.appendChild(el(ri === 0 || ci === 0 ? "th" : "td", "", v)); });
      tbl.appendChild(tr);
    });
    wrap.appendChild(tbl);
    wrap.style.marginTop = "10px";
    box.appendChild(wrap);

    root.appendChild(box);

    // --- 全員分の内訳表(最初から表示) ---
    root.appendChild(el("h2", "", "全員分の内訳表(ペア回数 / 対戦回数)"));
    var det = el("div", "card inner");
    var wrap2 = el("div", "scroll");
    var t2 = el("table");
    var head = el("tr");
    head.appendChild(el("th", "", ""));
    for (i = 0; i < N; i++) head.appendChild(el("th", "", i + 1));
    t2.appendChild(head);
    for (i = 0; i < N; i++) {
      var tr = el("tr");
      tr.appendChild(el("th", "", i + 1));
      for (var j = 0; j < N; j++) {
        tr.appendChild(i === j ? el("td", "self", "") : el("td", "", s.P[i][j] + "/" + s.O[i][j]));
      }
      t2.appendChild(tr);
    }
    wrap2.appendChild(t2);
    det.appendChild(wrap2);
    root.appendChild(det);
  }

  function setMsg(text, isError) {
    $("msg").textContent = text;
    $("msg").className = isError ? "error" : "";
  }

  $("form").addEventListener("submit", function (ev) {
    ev.preventDefault();
    var C = parseInt($("courts").value, 10);
    var N = parseInt($("players").value, 10);
    var R = parseInt($("rounds").value, 10);
    if (!(N >= 4 * C)) { setMsg("人数は " + (4 * C) + " 人以上(面数×4以上)にしてください。", true); return; }
    if (N > 60) { setMsg("人数は 60 人以下にしてください。", true); return; }
    if (!(R >= 1 && R <= 100)) { setMsg("ラウンド数は 1〜100 にしてください。", true); return; }

    if (current && current.checks.some(Boolean) &&
        !window.confirm("いまの組み合わせとチェックを消して、新しく作り直します。よろしいですか?")) return;

    setMsg("計算中…", false);
    $("go").disabled = true;
    setTimeout(function () {
      try {
        var out = generate(C, N, R, 1200);
        current = { C: C, N: N, R: R, schedule: out.schedule, checks: [] };
        var saved = save();
        render(C, N, R, out);
        setMsg("作成しました(" + out.tries + " 通りの案から最良のものを選択)。もう一度「決定」を押すと別の案を作ります。" +
          (saved ? "" : " ※このブラウザでは保存できないため、再読み込みすると消えます。"), false);
        $("print").hidden = false;
      } catch (e) {
        setMsg("エラーが発生しました: " + e.message, true);
      }
      $("go").disabled = false;
    }, 30);
  });

  $("print").addEventListener("click", function () { window.print(); });

  // 前回の組み合わせとチェックを復元
  current = load();
  if (current) {
    $("courts").value = String(current.C);
    $("players").value = current.N;
    $("rounds").value = current.R;
    render(current.C, current.N, current.R, current);
    setMsg("前回の組み合わせを表示しています。「決定」を押すと新しく作り直します。", false);
    $("print").hidden = false;
  }
}
</script>
</body>
</html>
